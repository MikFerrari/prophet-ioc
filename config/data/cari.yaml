# CARI v2 reaches of train.py and eval.py: subjects x instructions at one velocity.
# train.py fits the cost weights by IOC on the complete reaches of the training subjects (subjects - test_subjects);
# eval.py predicts the reaches of the held-out test subjects from each observed fraction in obs_ratios.
subjects: [sub_3, sub_4, sub_6, sub_7, sub_8, sub_9, sub_10, sub_11, sub_12, sub_13]
test_subjects: [sub_13]          # held out: never seen by train.py
instructions: [0, 1, 2, 3, 4, 5, 6, 7, 8]   # 1, 3, 5 reach objects; 7 reach the robot (both hands); 0, 2, 4, 6, 8 hands home
velocity: FAST                   # FAST | MEDIUM | SLOW
obs_ratios: [0.1, 0.3, 0.5, 0.7]
