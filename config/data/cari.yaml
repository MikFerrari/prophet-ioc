# CARI v2 reaches of train.py and eval.py: subjects x instructions at one velocity.
# train.py fits the cost weights by IOC on the complete reaches of the training subjects (subjects - test_subjects);
# eval.py predicts the reaches of the held-out test subjects from each observed fraction in obs_ratios.
subjects: [sub_3, sub_4, sub_6, sub_7, sub_8, sub_9, sub_10, sub_11, sub_12, sub_13]
test_subjects: [sub_13]          # held out: never seen by train.py
instructions: [1, 3, 5]                   # single-hand reaches to objects (1: right, 3: left, 5: right cross-reach)
velocities: [SLOW, MEDIUM, FAST]  # list of velocities (e.g. [SLOW, MEDIUM, FAST]) or single string
obs_ratios: [0.2, 0.5, 0.7]
head_keypoint: centroid          # model "head" of the IK angles: nose (ZED kp0, original CARI v2 IK) | centroid (of nose and
                                 # ears: steadier, less forward; datasets/build_cari_v2_head_centroid.py,
                                 # cache/pick_place_joints_head_centroid.pkl)
state_estimator: rts             # joint positions / velocities of the training windows: rts (Rauch-Tung-Striebel
                                 # smoother under the model's ZOH dynamics, consistent with the model) | savgol
                                 # (Savitzky-Golay, window of the dataset's preprocessing)
rts_accel_noise: 10.0            # rts: white-noise acceleration intensity (rad/s^2/sqrt(s); m for the pelvis)
rts_obs_noise: 0.005             # rts: noise of the IK joint angles (rad; m for the pelvis)
