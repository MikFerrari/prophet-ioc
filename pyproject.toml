[build-system]
requires = ["setuptools >= 64"]
build-backend = "setuptools.build_meta"

[project]
name = "prophet-ioc"
version = "0.1.0"
description = "PROPHET: PRObabilistic Partially-observable Human Estimation Toolkit for Motion Forecasting via Inverse Optimal Control."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Michele Ferrari", email = "michele.ferrari@unibs.it" }]
requires-python = ">= 3.11"
dependencies = [
    # core: IOC, control solvers, prediction
    "jax >= 0.4.30",
    "jaxlib >= 0.4.30",
    "jaxopt >= 0.8",
    "numpy >= 1.24",
    "scipy >= 1.10",
    "numpyro >= 0.11.0",
    "arviz >= 0.13.0",
    # data loading (prophet_ioc.data.cari, evaluation/)
    "pandas >= 2.0",
    "pyyaml >= 6.0",
    "tqdm >= 4.60",
    # train.py / eval.py / evaluation/ configuration
    "hydra-core >= 1.3",
    "omegaconf >= 2.3",
    # plotting (plot_utils, prophet_ioc.prediction); kaleido exports plotly figures to PDF/PNG
    "matplotlib >= 3.6.0",
    "plotly >= 5.0",
    "kaleido >= 0.2",
    "pillow >= 9.0",
]

[project.optional-dependencies]
# NVIDIA GPU backend (driver >= 580): pip install -e ".[cuda]"
cuda = ["jax[cuda13]"]
# tests, plus what ../human_kinematic_model needs for its binding build and tests
dev = ["pytest >= 7", "pybind11 >= 2.10", "sympy"]
# experiment tracking of train.py / eval.py (config wandb): pip install -e ".[tracking]"
tracking = ["wandb"]

# human_kinematic_model_jax (../human_kinematic_model/scripts) is not a pip package: it is put on sys.path by
# human_kinematic_model.pth in the venv's site-packages (see README). kimodo/torch (evaluation/kimodo_reaches.py
# generate) run in kimodo's own venv, the ROS 2 node (ros2/) in the ROS environment.

[tool.setuptools.packages.find]
include = ["prophet_ioc*", "plot_utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests", "evaluation"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["evaluation", "../human_kinematic_model/scripts"]
